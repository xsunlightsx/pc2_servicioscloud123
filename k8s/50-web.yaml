apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ventas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: web-ventas:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: GENERADOR_URL
              value: http://generador:5000
            - name: RABBIT_HOST
              value: rabbitmq
            - name: RABBIT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credenciales
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBIT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credenciales
                  key: RABBITMQ_DEFAULT_PASS
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credenciales
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credenciales
                  key: POSTGRES_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-credenciales
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
---
# ÚNICO servicio expuesto a la laptop: http://localhost:30080
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: ventas
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080
