apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credenciales
  namespace: ventas
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: ventas_user
  RABBITMQ_DEFAULT_PASS: ventas_pass
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: ventas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          envFrom:
            - secretRef:
                name: rabbitmq-credenciales
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
---
# Servicio interno: "rabbitmq:5672" (AMQP) y "rabbitmq:15672" (API de gestión, la usará KEDA y la web)
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: ventas
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672