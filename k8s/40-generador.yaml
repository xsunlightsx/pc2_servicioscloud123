apiVersion: apps/v1
kind: Deployment
metadata:
  name: generador
  namespace: ventas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: generador
  template:
    metadata:
      labels:
        app: generador
    spec:
      containers:
        - name: generador
          image: generador-ventas:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: RABBIT_HOST
              value: rabbitmq
            - name: RABBIT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credenciales
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBIT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credenciales
                  key: RABBITMQ_DEFAULT_PASS
          readinessProbe:
            httpGet:
              path: /estado
              port: 5000
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
---
# Interno: solo la web lo llama, como http://generador:5000
apiVersion: v1
kind: Service
metadata:
  name: generador
  namespace: ventas
spec:
  type: ClusterIP
  selector:
    app: generador
  ports:
    - port: 5000
      targetPort: 5000
