apiVersion: v1
kind: Pod
metadata:
  name: prueba-pending
  namespace: ventas
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "100m"
          memory: 64Mi
        limits:
          cpu: "200m"
          memory: 128Mi